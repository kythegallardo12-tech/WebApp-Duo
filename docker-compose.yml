# Local MongoDB as a single-node replica set (required for multi-document transactions).
#   npm run db:up      # start
#   npm run db:down    # stop (data is kept in the "mongo-data" volume)
services:
  mongo:
    image: mongo:7
    container_name: stockflow-mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once it has a primary.
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s
    restart: unless-stopped

volumes:
  mongo-data:
